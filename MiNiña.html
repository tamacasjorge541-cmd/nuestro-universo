        }
        #escena { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
        
        /* LA LUNA SECRETA */
        .luna {
            position: absolute; top: 40px; right: 40px;
            width: 70px; height: 70px;
            background: radial-gradient(circle, #fffbe6 0%, #f5f3ce 100%);
            border-radius: 50%; cursor: pointer; z-index: 100;
            box-shadow: 0 0 40px #fffbe6;
            transition: 0.5s;
        }
        .luna:active { transform: scale(0.9); box-shadow: 0 0 80px #ff4d6d; }

        /* VENTANA DE DECLARACIÓN */
        #ventana-secreta {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            width: 85%; max-width: 400px; background: rgba(10, 10, 15, 0.95);
            border: 2px solid #ff4d6d; border-radius: 20px;
            padding: 30px; text-align: center; color: white;
            z-index: 200; transition: 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 100px rgba(255, 77, 109, 0.5);
            backdrop-filter: blur(10px);
        }
        #ventana-secreta.abierta { transform: translate(-50%, -50%) scale(1); }

        .btn {
            padding: 15px 30px; margin: 10px; border: none; border-radius: 50px;
            font-size: 1.1rem; cursor: pointer; transition: 0.3s; font-weight: bold;
        }
        .si { background: #ff4d6d; color: white; box-shadow: 0 0 20px #ff4d6d; }
        .no { background: transparent; color: #666; border: 1px solid #333; }

        #poema-guia {

            color: rgba(255,255,255,0.6); font-style: italic; font-size: 1rem;
            pointer-events: none; z-index: 10;
        }

        /* Lluvia de corazones al decir sí */
        .corazon {
            position: fixed; color: #ff4d6d; font-size: 20px;
            pointer-events: none; z-index: 300; animation: caer 3s linear forwards;
        }
        @keyframes caer {

        // --- LÓGICA DEL MOTOR ---
        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', init);
        init();

        class Estrella {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5;
                this.op = Math.random();
                this.speed = Math.random() * 0.02;
            }
            dibujar() {
                ctx.fillStyle = `rgba(255,255,255,${this.op})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
                ctx.fill();
            }
            update() {
                this.op += this.speed;
                if(this.op > 1 || this.op < 0) this.speed *= -1;
            }
        }

        for(let i=0; i<400; i++) particulas.push(new Estrella());

        function animar() {
            ctx.fillStyle = '#00050a';
            ctx.fillRect(0,0,canvas.width, canvas.height);
            particulas.forEach(p => { p.update(); p.dibujar(); });
            requestAnimationFrame(animar);
        }
        animar();
